version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: saas_antigravity_db
    restart: always
    environment:
      POSTGRES_DB: saas_antigravity
      POSTGRES_USER: admin_antigravity
      POSTGRES_PASSWORD: cebdef04370d542a7e7d70827ce798cb
    ports:
      - "5432:5432"
    volumes:
      - saas_db_data:/var/lib/postgresql/data

  # Backend orquestador (Node.js)
  backend-orchestrator:
    build:
      context: ./backend
    container_name: saas_backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://admin_antigravity:cebdef04370d542a7e7d70827ce798cb@postgres:5432/saas_antigravity
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Nucleo de IA (Python)
  ai-core:
    build:
      context: ./ai_core
    container_name: saas_ai_core
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      DB_URL: postgresql://admin_antigravity:cebdef04370d542a7e7d70827ce798cb@postgres:5432/saas_antigravity
    ports:
      - "5000:5000"

  # Meta Service — reemplaza Baileys (WA) + instagrapi (IG)
  # Soporta: WhatsApp Business API + Messenger + Instagram Messaging
  meta-service:
    build:
      context: ./ai_core/meta_service
    container_name: saas_meta_service
    restart: always
    depends_on:
      - ai-core
    environment:
      PORT: 8080
      AUTHENTICATION_API_KEY: PICE-SAAS-DEFAULT-KEY-2026
      # URL del relay publico (Cloudflare Tunnel sobre smart-box.com.ar)
      META_RELAY_WS: wss://relay.smart-box.com.ar/ws
      RELAY_API_KEY: PICE-SAAS-DEFAULT-KEY-2026
      # Webhook interno al nucleo IA (dentro de la red Docker)
      NUCLEO_WEBHOOK_URL: http://ai-core:5000/webhook
      META_GRAPH_VERSION: v20.0
    ports:
      - "8080:8080"
    volumes:
      - ./ai_core/meta_service:/app
      - /app/node_modules

volumes:
  saas_db_data:
